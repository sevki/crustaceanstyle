[package]
name = "crustaceanstyle"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Safety-, performance-, and developer-experience-oriented Rust primitives and style."
repository = "https://github.com/sevki/crustaceanstyle"
readme = "README.md"
keywords = ["rust", "style", "safety", "systems"]
categories = ["development-tools"]

[dependencies]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
